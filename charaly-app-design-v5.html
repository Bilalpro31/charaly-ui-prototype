<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charaly Charaly: full app design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{--bg:#f3f3f6;--fg:#14141a;--mut:#6a6a78;--ln:#d9d9e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.lab{padding:20px 16px 8px;max-width:760px;margin:0 auto}
.lab b{font-weight:700;letter-spacing:.14em;font-size:12px}
.lab h1{margin:2px 0 4px;font-size:26px;font-weight:600;letter-spacing:-.02em}
.lab p{margin:0;color:var(--mut)}
.row{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:0 auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.t{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);font-size:13px}
.t.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#desc{max-width:760px;margin:6px auto 14px;padding:0 16px;color:var(--mut)}
.ph{--b:#0f0f11;--s1:#1c1c1f;--s2:#2b2b2f;--t:#f4f4f6;--m:#9b9ba4;--bl:#3b63ff;--am:#f2b66d;--l:rgba(255,255,255,.1);position:relative;width:min(390px,100%);height:min(844px,calc(100dvh - 210px));min-height:640px;margin:0 auto 24px;overflow:hidden;background:var(--b);color:var(--t);isolation:isolate;border-radius:22px}
@media(min-width:600px){.ph{border:9px solid #000;border-radius:46px;box-shadow:0 30px 70px rgba(0,0,0,.35)}}
.sb{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:11px 24px 0;font-size:11px;font-weight:600;color:rgba(255,255,255,.9);pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.bd{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:44px 16px 96px}
.bd::-webkit-scrollbar,.ms::-webkit-scrollbar,.hs::-webkit-scrollbar,.sg::-webkit-scrollbar,.shd::-webkit-scrollbar{display:none}
.mu{color:var(--m)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.025em}
svg.sc{position:absolute;inset:0;width:100%;height:100%}
.pt{display:block;width:100%;height:100%;background:radial-gradient(circle at 50% 32%,hsl(var(--h) 65% 80%) 0 13%,transparent 14%),radial-gradient(ellipse at 50% 78%,hsl(var(--h) 55% 60%) 0 33%,transparent 34%),linear-gradient(170deg,hsl(var(--h) 50% 32%),hsl(calc(var(--h) + 45) 45% 12%))}
.av{flex:none;overflow:hidden;width:var(--s,34px);height:var(--s,34px);border-radius:var(--r,50%);display:block;position:relative}
/* home */
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-size:30px;font-weight:700;letter-spacing:-.05em}
.ic2{display:flex;gap:14px;align-items:center}
.dotb{position:relative}.dotb::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--bl);border:2px solid var(--b)}
.srch{display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:99px;background:var(--s2);color:var(--m);font-size:17px;margin-bottom:14px}
.pls{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 18px;padding:0 16px;scrollbar-width:none}
.pl{flex:none;padding:10px 18px;border-radius:99px;border:1px solid #3b3b40;font-size:16px;font-weight:500}
.pl.on{background:#f4f4f6;color:#111;border-color:#f4f4f6}
.cont{position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:26px;overflow:hidden;margin-bottom:20px}
.cont::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.82))}
.cont .tx{position:absolute;left:16px;right:70px;bottom:14px;z-index:2}
.cont h2{font-size:23px;margin:6px 0 2px}.cont p{margin:0;font-size:13px;color:rgba(255,255,255,.8)}
.cont .pb{position:absolute;right:14px;bottom:14px;z-index:2;width:46px;height:46px;border-radius:50%;background:#f4f4f6;color:#111;display:grid;place-items:center}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:rgba(14,14,18,.6);backdrop-filter:blur(10px);font-size:12px;font-weight:600;color:var(--am)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--am);animation:pu 1.8s infinite}
@keyframes pu{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.live i,.dots i{animation:none}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}
.cd .im{position:relative;aspect-ratio:1;border-radius:24px;overflow:hidden}
.cd .im .live,.cd .im .nw{position:absolute;top:10px;left:10px;z-index:2}
.nw{padding:5px 11px;border-radius:99px;background:var(--bl);font-size:12px;font-weight:700;color:#fff}
.cd h3{font-size:20px;margin:10px 0 3px}

.tg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}

.stt{font-size:13px;color:var(--m);display:flex;gap:10px;align-items:center}
/* library */
.lh{display:flex;align-items:center;gap:12px;margin-bottom:14px}

.ps{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}

.bd2{display:inline-block;padding:7px 14px;border-radius:12px;background:var(--bl);font-weight:700;font-size:15px;margin-right:8px}

.cs{flex:none;width:92px;text-align:center;font-size:13px}
.cs .av{--s:84px;margin:0 auto 6px;box-shadow:0 0 0 2px var(--b),0 0 0 4px var(--am)}

/* nav */
.nv{position:absolute;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:space-between;align-items:center;padding:12px 22px 16px;background:linear-gradient(transparent,#0f0f11 38%)}
.nv button{width:44px;height:44px;display:grid;place-items:center;color:#cfcfd6;position:relative}
.nv button.on{color:#fff}
.nv .dt::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bl)}
/* chat */
.cbg{position:absolute;inset:0;z-index:-1}
.cbg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 24%,transparent 38%,rgba(8,8,10,.82) 100%)}
.ch{display:flex;align-items:center;gap:6px;padding:34px 10px 0;z-index:5;position:relative}
.ch .tt{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.gp{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px;background:rgba(40,40,46,.62);backdrop-filter:blur(12px);border:1px solid var(--l);font-weight:600;font-size:14px;position:relative;flex:none}

.gi{width:36px;height:36px;display:grid;place-items:center;flex:none;position:relative;color:#fff;filter:drop-shadow(0 1px 6px rgba(0,0,0,.5))}

.dsc{text-align:center;font-size:11.5px;line-height:1.35;color:rgba(255,255,255,.62);padding:12px 54px 0;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rail{position:absolute;right:10px;top:120px;z-index:6;display:flex;flex-direction:column;gap:10px;align-items:center}

.stk{display:flex;flex-direction:column;align-items:center;padding:4px;border-radius:99px;background:rgba(24,24,28,.62);backdrop-filter:blur(12px);border:1px solid var(--l)}
.stk .av{--s:34px;margin-top:-8px;box-shadow:0 0 0 2px #1d1d21}.stk .av:first-child{margin-top:0}
.tens{position:absolute;left:14px;top:132px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;color:rgba(255,255,255,.65)}
.tens .tr{width:5px;height:120px;border-radius:5px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}

.ms{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:0 14px 6px;scrollbar-width:none}
.ms.hud{padding-left:34px;padding-right:62px}
.mi{margin-top:auto}
.gb{background:rgba(16,16,20,.74);backdrop-filter:blur(12px);border-radius:22px;padding:14px 16px;line-height:1.55;font-size:16px}
.gb.n{font-style:italic;color:#d4d4dc;margin:10px 0}
.gb.pv{margin:12px 0}.gb.pv b{display:block;font-style:normal;font-size:17px;color:#fff;margin-bottom:3px}
.cm{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
.cm .gb{border-top-left-radius:6px;flex:1;min-width:0}
.cm .nm{font-size:13px;font-weight:700;color:var(--am);margin-bottom:2px;font-style:normal}
.um{margin:10px 0 10px auto;width:fit-content;max-width:88%;padding:11px 16px;border-radius:22px 22px 6px 22px;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);font-size:16px;line-height:1.5}
.um small{color:var(--am);font-weight:700;margin-right:6px}
.rp{display:flex;margin:-2px 0 6px 42px}
.rp span{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:99px;background:rgba(242,182,109,.14);border:1px solid rgba(242,182,109,.3);color:var(--am);font-size:12.5px;font-weight:600;backdrop-filter:blur(8px);animation:rin .5s}
@keyframes rin{from{opacity:0;transform:translateY(6px)}}
.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--m);animation:pu 1s infinite}
.mv{padding:2px 16px 4px;font-size:12.5px;color:var(--am);display:flex;gap:6px;align-items:center;height:22px}
.sg{display:flex;gap:8px;overflow-x:auto;padding:4px 14px;scrollbar-width:none}
.sg button{flex:none;padding:9px 15px;border-radius:99px;background:rgba(40,40,46,.7);backdrop-filter:blur(10px);border:1px solid var(--l);font-size:14px}
.bar{display:flex;align-items:center;gap:8px;padding:6px 12px 14px}
.bar>button{width:44px;height:44px;display:grid;place-items:center;position:relative;flex:none;color:#e8e8ee}
.ip{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:4px 6px 4px 16px;border-radius:99px;background:rgba(60,60,66,.62);backdrop-filter:blur(14px);border:1px solid var(--l)}
.ip input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:16px Figtree,sans-serif;padding:9px 0}
.ip input::placeholder{color:rgba(255,255,255,.55)}
.md{font-size:13px;font-weight:700;color:var(--am);flex:none}
.sd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:#e8e8ee}
.sd.go{background:#f4f4f6;color:#111}
.kb{height:250px;background:#1a1a21;display:grid;place-items:center;color:var(--m);font-size:12px;background-image:repeating-linear-gradient(#1a1a21 0 38px,#25252e 38px 40px)}
/* sheets */
.scm{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55)}
.shd{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:80%;overflow-y:auto;background:#1a1a1d;border-radius:28px 28px 0 0;padding:10px 20px 26px;scrollbar-width:none;animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.gr{width:40px;height:4px;border-radius:4px;background:var(--s2);margin:0 auto 16px}
.shd h3{font-size:22px;margin-bottom:2px}
.shd h4{font-size:13px;color:var(--m);font-weight:600;margin:20px 0 8px}
.clk{display:flex;align-items:center;gap:16px;margin:8px 0 4px}
.clk b{font-size:52px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--am)}
.arc{height:6px;border-radius:6px;background:linear-gradient(90deg,#f2d28b,#e8845a 40%,#3b3a7a 70%,#15152c);position:relative;margin:14px 0 4px}
.arc i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--am);transform:translateX(-50%)}
.al{display:flex;justify-content:space-between;font-size:11px;color:var(--m)}
.pp{display:flex;gap:12px;align-items:center;padding:8px 0;width:100%}
.pp b{display:block;font-weight:600}.pp span{font-size:13px;color:var(--m)}
.it{display:flex;gap:10px;padding:8px 0;line-height:1.4;align-items:flex-start}
.it::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--am);margin-top:7px;flex:none}
.it.nw2::before{background:var(--bl)}
.it small{color:var(--m);display:block;font-size:12px}
.pm{padding:12px 14px;border-radius:16px;background:var(--s1);margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pm span{font-size:13px;color:var(--am);font-weight:600;white-space:nowrap}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tl button{padding:16px 14px;border-radius:18px;background:var(--s1);display:flex;flex-direction:column;gap:8px;font-weight:600}
.tl button small{color:var(--m);font-weight:400;font-size:12px}
.tl button.on{background:#f4f4f6;color:#111}.tl button.on small{color:#555}
.sgm{display:flex;gap:6px;margin:6px 0}
.sgm button{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--s1);font-weight:600;font-size:14px;color:var(--m)}
.sgm button.on{background:#f4f4f6;color:#111}
.bt{display:inline-block;padding:12px 20px;border-radius:99px;background:var(--s2);font-weight:600;margin:6px 8px 0 0}
.bt.p{background:#f4f4f6;color:#111}
.bar2{height:6px;border-radius:6px;background:var(--s2);margin:6px 0 2px}.bar2 i{display:block;height:100%;border-radius:6px;background:var(--am)}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--s2);font-size:13px}
.mr{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--l)}.mr .g{flex:1;min-width:0}.mr b{font-size:17px;display:block}
.ok{color:#7fd6a4}.wn{color:#e8b86a}
.set{padding:16px 0;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:12px;font-size:16px}.set span{color:var(--m)}
.big{display:block;width:100%;padding:18px;border-radius:22px;background:var(--s1);margin-bottom:12px}.big b{font-size:18px;display:block}.big span{color:var(--m)}

.cta2{position:absolute;left:0;right:0;bottom:0;z-index:14;padding:26px 16px 18px;background:linear-gradient(transparent,#0f0f11 45%)}
.pr{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px;border-radius:99px;background:#f4f4f6;color:#111;font-weight:700;font-size:17px;text-align:center}
.pr[disabled]{background:var(--s2);color:var(--m)}
.bk{position:absolute;top:34px;left:12px;z-index:15;width:40px;height:40px;border-radius:50%;background:rgba(24,24,28,.6);backdrop-filter:blur(12px);display:grid;place-items:center;color:#fff}
.hr2{position:relative;height:430px;margin:0 -16px}
.hr2::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.3),transparent 30%,#0f0f11 97%)}
.hr2 .tx{position:absolute;left:16px;right:16px;bottom:6px;z-index:2}
.hr2 h1{font-size:36px;line-height:1.05;margin:8px 0 4px}
.hk{padding:12px 16px;border-radius:18px;background:var(--s1);font-style:italic;color:#d4d4dc;margin:8px 0;line-height:1.5}
.ob{position:absolute;inset:0}
.ob .tx{position:absolute;left:22px;right:22px;bottom:120px;z-index:3}
.ob h1{font-size:34px;line-height:1.1}
.dg{display:flex;gap:6px;margin:6px 0 16px}.dg i{height:4px;flex:1;border-radius:4px;background:rgba(255,255,255,.22)}.dg i.on{background:#fff}

.ck.on{border-color:var(--am)}.ck.t2{padding:9px 16px}

.fld:focus-visible{border-color:var(--am)}
.lb{font-size:13px;color:var(--m);font-weight:600}
.sw{width:50px;height:30px;border-radius:30px;background:var(--s2);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--am)}.sw.on::after{left:23px}

<body>
<header class="lab"><b>CHARALY</b><h1>Charaly: full app design</h1><p>The v4 look, applied to every screen of the app.</p></header>
<div class="row" id="ts"></div>
<div class="row" id="tx"></div>
<p id="desc"></p>
<div class="ph" id="ph"></div>
